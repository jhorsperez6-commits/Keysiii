<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serve Pene Hub - Canjear Key</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0b0c10; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #121316; border: 1px solid #2d3142; padding: 30px 20px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.7); }
        h1 { color: #00bfff; font-size: 22px; margin-bottom: 5px; font-weight: bold; }
        .subtitle { color: #00ff88; font-size: 13px; font-weight: bold; margin-bottom: 20px; }
        
        .box-input { margin-bottom: 15px; text-align: left; }
        label { font-size: 12px; color: #aaa; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; background: #1a1c23; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 15px; text-align: center; font-weight: bold; }
        
        .btn { background: #00bfff; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 10px; }
        
        .key-box { background-color: #1a1c23; border: 1px dashed #00bfff; padding: 15px; border-radius: 10px; margin-top: 20px; display: none; }
        .key-text { color: #00ff88; font-family: monospace; font-size: 16px; font-weight: bold; word-break: break-all; background: #0b0c10; padding: 10px; border-radius: 6px; border: 1px solid #333; margin-top: 8px; }
        
        .error-text { color: #ff4d4d; font-size: 13px; margin-top: 15px; font-weight: bold; display: none; }
        .info { font-size: 11px; color: #8c91a0; margin-top: 20px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="card">
        <h1>SERVE PENE HUB</h1>
        <div class="subtitle">Sistema de Verificación de Keys</div>

        <div class="box-input">
            <label for="userNumber">Ingresa tu número asignado:</label>
            <input type="number" id="userNumber" placeholder="Ej. 1, 250..." min="1" max="1000">
        </div>

        <button class="btn" onclick="verificarYObtenerKey()">Obtener mi Key</button>

        <div class="error-text" id="errorMsg">Número inválido o no autorizado. Ingresa tu número correcto.</div>

        <div class="key-box" id="resultBox">
            <div style="font-size: 12px; color: #aaa;">Tu Key Única:</div>
            <div class="key-text" id="assignedKey">---</div>
            <button class="btn" style="background: #00cc66; margin-top: 12px;" onclick="copiarKey()">Copiar Key</button>
        </div>

        <div class="info">
            Cada usuario tiene un número único y exclusivo. Solo se permite 1 key por número.
        </div>
    </div>

    <script>
        const keysDatabase = {
            1: "SPH-X9mK-22pL", 2: "SPH-Z7vB-44nT", 3: "SPH-Q3wX-99aZ", 4: "SPH-H8jN-33kK", 5: "SPH-F2dL-66xX",
            6: "SPH-M5kP-11zZ", 7: "SPH-T1qW-88mN", 8: "SPH-K4xX-55vV", 9: "SPH-L9zZ-22pP", 10: "SPH-P6bB-77qQ",
            250: "SPH-HUB-250-VIP"
        };

        function verificarYObtenerKey() {
            var numInput = document.getElementById("userNumber").value.trim();
            var errorDiv = document.getElementById("errorMsg");
            var resultBox = document.getElementById("resultBox");
            var keyDisplay = document.getElementById("assignedKey");

            errorDiv.style.display = "none";
            resultBox.style.display = "none";

            var num = parseInt(numInput);

            if (!num || !keysDatabase[num]) {
                errorDiv.innerText = "Número no válido o no existe en el sistema. Escribe tu número asignado.";
                errorDiv.style.display = "block";
                return;
            }

            var usadas = [];
            try {
                usadas = JSON.parse(localStorage.getItem("sph_numeros_reclamados") || "[]");
            } catch(e) { usadas = []; }

            if (usadas.includes(num)) {
                errorDiv.innerText = "¡Este número ya reclamó su key anteriormente!";
                errorDiv.style.display = "block";
                return;
            }

            var keyAsignada = keysDatabase[num];
            keyDisplay.innerText = keyAsignada;
            resultBox.style.display = "block";

            usadas.push(num);
            localStorage.setItem("sph_numeros_reclamados", JSON.stringify(usadas));
        }

        function copiarKey() {
            var keyText = document.getElementById("assignedKey").innerText;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(keyText).then(function() {
                    alert("¡Key copiada con éxito!");
                });
            } else {
                alert("Tu key es: " + keyText);
            }
        }
    </script>
</body>
</html>
