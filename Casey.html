<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serve Pene Hub - Canjear Key</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
        body { background-color: #0b0c10; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .card { background-color: #121316; border: 2px solid #00bfff; padding: 25px 20px; border-radius: 16px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.8); }
        h1 { color: #00bfff; font-size: 20px; margin-bottom: 5px; font-weight: bold; }
        .subtitle { color: #00ff88; font-size: 12px; font-weight: bold; margin-bottom: 20px; }
        .box-input { margin-bottom: 15px; text-align: left; }
        label { font-size: 11px; color: #aaa; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; background: #1a1c23; border: 1px solid #00bfff; color: #fff; border-radius: 8px; font-size: 16px; text-align: center; font-weight: bold; }
        .btn { background: #00bfff; color: #000; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 5px; }
        .btn:active { transform: scale(0.98); }
        .key-box { background-color: #1a1c23; border: 1px dashed #00ff88; padding: 15px; border-radius: 10px; margin-top: 20px; display: none; }
        .key-text { color: #00ff88; font-family: monospace; font-size: 15px; font-weight: bold; word-break: break-all; background: #0b0c10; padding: 10px; border-radius: 6px; border: 1px solid #333; margin-top: 8px; }
        .error-text { color: #ff4d4d; font-size: 12px; margin-top: 15px; font-weight: bold; display: none; }
        .info { font-size: 11px; color: #8c91a0; margin-top: 20px; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="card">
        <h1>SERVE PENE HUB</h1>
        <div class="subtitle">SISTEMA OFICIAL DE KEYS</div>

        <div class="box-input">
            <label>Ingresa tu número asignado (1 al 1000):</label>
            <input type="number" id="userNumber" placeholder="Ej. 1, 250, 1000..." min="1" max="1000">
        </div>

        <button class="btn" onclick="verificarYObtenerKey()">GENERAR MI KEY</button>

        <div class="error-text" id="errorMsg">Número no válido o ya utilizado.</div>

        <div class="key-box" id="resultBox">
            <div style="font-size: 11px; color: #aaa;">Tu Key Única Asignada:</div>
            <div class="key-text" id="assignedKey">---</div>
            <button class="btn" style="background: #00ff88; color: #000; margin-top: 12px;" onclick="copiarKey()">Copiar Key al Portapapeles</button>
        </div>

        <div class="info">
            Cada número es único. Si intentas usar un número ajeno o repetido, el sistema lo bloqueará.
        </div>
    </div>

    <script>
        // Generador automático de 1000 keys únicas por número
        const keysDatabase = {};
        const prefixes = ["SPH", "VIP", "GOD", "PRO", "LUA", "HUB", "ELITE", "X", "K", "Z"];
        
        for (let i = 1; i <= 1000; i++) {
            let pref = prefixes[i % prefixes.length];
            let suf = (i * 73).toString(36).toUpperCase();
            keysDatabase[i] = `${pref}-${i}-${suf}`;
        }

        function verificarYObtenerKey() {
            var numInput = document.getElementById("userNumber").value.trim();
            var errorDiv = document.getElementById("errorMsg");
            var resultBox = document.getElementById("resultBox");
            var keyDisplay = document.getElementById("assignedKey");

            errorDiv.style.display = "none";
            resultBox.style.display = "none";

            var num = parseInt(numInput);

            if (!num || num < 1 || num > 1000) {
                errorDiv.innerText = "Por favor ingresa un número válido entre 1 y 1000.";
                errorDiv.style.display = "block";
                return;
            }

            var usadas = [];
            try {
                usadas = JSON.parse(localStorage.getItem("sph_numeros_usados") || "[]");
            } catch(e) { usadas = []; }

            if (usadas.includes(num)) {
                errorDiv.innerText = "¡Este número ya fue utilizado para reclamar una key!";
                errorDiv.style.display = "block";
                return;
            }

            var keyAsignada = keysDatabase[num];
            keyDisplay.innerText = keyAsignada;
            resultBox.style.display = "block";

            usadas.push(num);
            localStorage.setItem("sph_numeros_usados", JSON.stringify(usadas));
        }

        function copiarKey() {
            var keyText = document.getElementById("assignedKey").innerText;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(keyText).then(function() {
                    alert("¡Key copiada con éxito!");
                });
            } else {
                alert("Tu key es: " + keyText);
            }
        }
    </script>
</body>
</html>
