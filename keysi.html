<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serve Pene Hub - Key System</title>
    <style>
        body {
            background: #090a0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 15px;
        }
        .container {
            background: #14161f;
            border: 2px solid #00d2ff;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
        }
        h2 {
            color: #00d2ff;
            margin-bottom: 5px;
            font-size: 20px;
        }
        p {
            color: #00ff88;
            font-size: 12px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-size: 11px;
            color: #aaa;
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            background: #1e222f;
            border: 1px solid #00d2ff;
            color: #fff;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            font-weight: bold;
            box-sizing: border-box;
        }
        button {
            background: #00d2ff;
            color: #000;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
        }
        button:active {
            opacity: 0.8;
        }
        .result-box {
            margin-top: 20px;
            background: #1e222f;
            border: 1px dashed #00ff88;
            padding: 12px;
            border-radius: 6px;
            display: none;
        }
        .key-text {
            color: #00ff88;
            font-family: monospace;
            font-size: 15px;
            font-weight: bold;
            word-break: break-all;
            margin-top: 5px;
        }
        .error-msg {
            color: #ff4d4d;
            font-size: 12px;
            margin-top: 12px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>SERVE PENE HUB</h2>
        <p>SISTEMA DE KEYS VERIFICADO</p>

        <div class="input-group">
            <label>Ingresa tu número asignado:</label>
            <input type="number" id="userNum" placeholder="Ej. 1, 250..." min="1" max="1000">
        </div>

        <button onclick="desbloquearKey()">GENERAR KEY</button>

        <div class="error-msg" id="errorBox">Número no válido o ya utilizado.</div>

        <div class="result-box" id="successBox">
            <div style="font-size: 11px; color: #aaa;">Tu Key Única:</div>
            <div class="key-text" id="finalKey">---</div>
            <button style="background: #00ff88; margin-top: 10px; padding: 8px;" onclick="copiarKey()">Copiar Key</button>
        </div>
    </div>

    <script>
        // Base de datos de keys organizadas por número exacto
        const database = {
            1: "SPH-ALPHA-01",
            2: "SPH-BETA-02",
            3: "SPH-GAMMA-03",
            10: "SPH-VIP-10",
            50: "SPH-PRO-50",
            100: "SPH-ELITE-100",
            250: "SPH-GOD-250",
            500: "SPH-MASTER-500"
        };

        function desbloquearKey() {
            var valInput = document.getElementById("userNum").value.trim();
            var errorBox = document.getElementById("errorBox");
            var successBox = document.getElementById("successBox");
            var finalKey = document.getElementById("finalKey");

            errorBox.style.display = "none";
            successBox.style.display = "none";

            var numero = parseInt(valInput);

            // Validar si el número existe
            if (!numero || !database[numero]) {
                errorBox.innerText = "Número incorrecto o no registrado en el sistema.";
                errorBox.style.display = "block";
                return;
            }

            // Validar si este número ya fue usado en este navegador
            var usados = [];
            try {
                usadas = JSON.parse(localStorage.getItem("sph_usados") || "[]");
            } catch(e) { usadas = []; }

            if (usadas.includes(numero)) {
                errorBox.innerText = "¡Este número ya fue utilizado para reclamar una key!";
                errorBox.style.display = "block";
                return;
            }

            // Entregar la key correspondiente
            var keyAsignada = database[numero];
            finalKey.innerText = keyAsignada;
            successBox.style.display = "block";

            // Guardar el número como usado para bloquearlo permanentemente en ese navegador
            usadas.push(numero);
            localStorage.setItem("sph_usados", JSON.stringify(usadas));
        }

        function copiarKey() {
            var texto = document.getElementById("finalKey").innerText;
            navigator.clipboard.writeText(texto).then(function() {
                alert("¡Key copiada al portapapeles con éxito!");
            });
        }
    </script>

</body>
</html>
